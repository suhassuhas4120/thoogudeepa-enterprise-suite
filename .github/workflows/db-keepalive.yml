name: Supabase Health Keepalive

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health:
    name: Keepalive Health Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ping App Health or Supabase DB
        env:
          DEPLOYED_APP_URL: ${{ secrets.DEPLOYED_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$DEPLOYED_APP_URL" ]; then
            URL="${DEPLOYED_APP_URL%/}/api/health"
            echo "DEPLOYED_APP_URL found. Pinging $URL..."
            for attempt in 1 2 3; do
              CODE=$(curl -s -o health.json -w "%{http_code}" --max-time 30 "$URL" || echo "000")
              echo "Attempt $attempt: HTTP $CODE"
              if [ "$CODE" = "200" ] && grep -q '"CONNECTED"' health.json; then
                echo "App and database are healthy."; cat health.json; exit 0
              fi
              sleep 10
            done
            echo "App health endpoint failed or returned non-200. Falling back to direct Supabase DB keepalive..."
          else
            echo "DEPLOYED_APP_URL secret is not set. Performing direct Supabase DB keepalive..."
          fi

          npx tsx scripts/ping-db-keepalive.ts
