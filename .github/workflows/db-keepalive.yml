name: Supabase Health Keepalive

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health:
    name: Keepalive Health Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (exercises app + database)
        env:
          DEPLOYED_APP_URL: ${{ secrets.DEPLOYED_APP_URL }}
        run: |
          if [ -z "$DEPLOYED_APP_URL" ]; then
            echo "::error::DEPLOYED_APP_URL secret is not set; keepalive would not touch the app or DB."
            exit 1
          fi
          URL="${DEPLOYED_APP_URL%/}/api/health"
          for attempt in 1 2 3; do
            CODE=$(curl -s -o health.json -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ] && grep -q '"CONNECTED"' health.json; then
              echo "App and database are healthy."; cat health.json; exit 0
            fi
            sleep 20
          done
          echo "::error::Health check failed after 3 attempts (last HTTP $CODE)"
          cat health.json 2>/dev/null || true
          exit 1
