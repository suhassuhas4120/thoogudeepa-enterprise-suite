name: Supabase Health Keepalive

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  ping-health:
    name: Keepalive Health Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping System Health Endpoint
        env:
          TARGET_URL: ${{ secrets.DEPLOYED_APP_URL || 'https://dwjjprzyyjmunhdxvkuo.supabase.co' }}
        run: |
          echo "Executing scheduled keepalive ping to $TARGET_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
          echo "HTTP response status code: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "Database connection is active and responsive."
          else
            echo "Warning: Response code $RESPONSE received."
          fi
